<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5d7f9c" />
  <title>Offline | Project QR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f2f5f8;
      color: #1c2833;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #d3dfe8;
      border-radius: 20px;
      max-width: 400px;
      width: 100%;
      overflow: hidden;
      text-align: center;
    }
    .inner { padding: 36px 28px; }
    .logo { height: 52px; width: auto; object-fit: contain; margin-bottom: 24px; }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: #1c2833; }
    p { font-size: 14px; line-height: 1.5; color: #688096; margin-bottom: 24px; }
    button {
      width: 100%;
      min-height: 46px;
      background: #5d7f9c;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { background: #48657f; }
    .bar { height: 10px; width: 100%; background: #5d7f9c; }
  </style>
</head>
<body>
  <div class="card">
    <div class="inner">
      <img src="/brand/logo.png" alt="Mimar Models" class="logo" />
      <h1>You are currently offline</h1>
      <p>Connect to Wi-Fi or mobile data to scan models and sync maintenance updates with Odoo.</p>
      <button onclick="window.location.reload()">Try Again</button>
    </div>
    <div class="bar"></div>
  </div>
</body>
</html>
